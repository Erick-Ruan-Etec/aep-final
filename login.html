<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/login.css">
    <title>Login</title>
</head>

<body>

    <div class="container">

        <a href="index.html">
            <button class="btnVoltar">Voltar</button>
        </a>

        <!-- Foto de cadastro acoplada acima do título -->
        <div class="foto-cadastro">
            <label for="inputFoto" title="Escolha sua foto">
                <img width="100px" style="margin-bottom: -30px;" src="images/user.png" alt=""
                    id="previewFoto">
                <div class="icon-overlay"></div>
            </label>
        </div>

        <h2>Login</h2>

        <form>
            <label for="email">Email:</label>
            <input type="email" id="email" placeholder="Digite seu Email">

            <label for="senha">Senha:</label>
            <input type="password" id="senha" placeholder="Digite sua senha">
        </form>

        <button class="button btnEntrar" id="btnlogin">Entrar</button>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="login.js"></script>

</body>

</html>
